<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>AUREVIX · {{ page if page else 'Sign in' }}</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"></head>
<body><header class="topbar"><a class="brand" href="{{ url_for('index') }}"><span class="mark">A</span>AUREVIX</a>
<div class="top-actions">{% if user %}<span class="muted">{{ role_titles[user.role] }}</span><a class="btn outline" href="{{ url_for('logout') }}">Sign out</a>{% endif %}</div></header>
{% with messages=get_flashed_messages(with_categories=true) %}{% if messages %}<div class="flashes">{% for category,message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}</div>{% endif %}{% endwith %}
{% block body %}{% endblock %}</body></html>
